
<!DOCTYPE html>
<html>
<head>
<title>Tcoin App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 margin:0;
 font-family:sans-serif;
 background:linear-gradient(to right,#4facfe,#00f2fe);
 color:white;
}

.box{
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 height:100vh;
}

input{
 margin:5px;
 padding:10px;
 width:80%;
 border:none;
 border-radius:5px;
}

button{
 background:green;
 color:white;
 border:none;
 padding:10px;
 width:85%;
 margin:5px;
 border-radius:5px;
}

.hidden{display:none;}

.header{
 text-align:center;
 padding:10px;
}
</style>
</head>

<body>

<div id="auth" class="box">
 <h2>🔥 Tcoin Login</h2>

 <input id="email" placeholder="Email">
 <input id="pass" type="password" placeholder="Password">

 <button onclick="login()">Login</button>
 <button onclick="register()">Register</button>
</div>

<div id="app" class="hidden">

 <div class="header">
  <h2>Dashboard</h2>
  <h3>Balance: <span id="bal">0</span></h3>
 </div>

 <button onclick="loadBalance()">Refresh</button>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAwEJXhlSz_2PPORwQcsqcOGTmZuUC4UZ8",
  authDomain: "tcoin-3d985.firebaseapp.com",
  databaseURL: "https://tcoin-3d985-default-rtdb.firebaseio.com",
  projectId: "tcoin-3d985",
  storageBucket: "tcoin-3d985.appspot.com",
  messagingSenderId: "599645098741",
  appId: "1:599645098741:web:2dc7d49cfc40ce49a52bbc"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let uid;

// LOGIN
function login(){
 auth.signInWithEmailAndPassword(email.value,pass.value)
 .then(user=>{
  uid = user.user.uid;
  startApp();
 })
 .catch(err=>{
  alert(err.message);
 });
}

// REGISTER
function register(){
 auth.createUserWithEmailAndPassword(email.value,pass.value)
 .then(user=>{
  uid = user.user.uid;

  db.ref("users/"+uid).set({
    balance:0
  });

  startApp();
 })
 .catch(err=>{
  alert(err.message);
 });
}

// START APP
function startApp(){
 document.getElementById("auth").style.display="none";
 document.getElementById("app").classList.remove("hidden");
 loadBalance();
}

// LOAD BALANCE
function loadBalance(){
 db.ref("users/"+uid+"/balance").on("value",snap=>{
  bal.innerText = snap.val();
 });
}
</script>

</body>
</html>
